<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Data-driven strategy for Airbnb hosts targeting the backpacker accommodation segment in Bangkok — 6,619 budget listings analysed."
    />
    <title>Bangkok Backpacker Index</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('bkk-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {
        /* private mode / blocked storage — fall through to the OS setting */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
